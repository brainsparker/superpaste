name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift Tests (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: SuperPaste

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version

      - name: Build and test
        run: swift test

      - name: Dump crash reports
        if: failure()
        run: |
          B=$(swift build --show-bin-path)
          H="$(dirname "$(xcrun -f swift)")/swiftpm-testing-helper"
          ls -la "$H" || true
          swift test --disable-xctest -v 2>&1 | tail -30 || true
          lldb --batch -o run -o "bt 30" -o "thread list" -- "$H" --test-bundle-path "$B/SuperPastePackageTests.xctest/Contents/MacOS/SuperPastePackageTests" --testing-library swift-testing 2>&1 | grep -v 'started\.$' | tail -80 || true
          ls -la ~/Library/Logs/DiagnosticReports/ || true
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do echo "=== $f"; head -c 20000 "$f"; done || true

  server-tests:
    name: Server Tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  shell-lint:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./
          severity: warning