name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift Tests (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: SuperPaste

    steps:
      - uses: actions/checkout@v4

      # Package.swift links the swift-testing framework from the Command Line
      # Tools. Building with Xcode's toolchain loads a second, mismatched copy
      # of Testing at runtime: #expect reports equal values as failures and the
      # runner aborts (signal 6). Use the CLT toolchain so they match.
      - name: Select Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          swift --version
          ls /Library/Developer/CommandLineTools/Library/Developer/Frameworks

      - name: Build and test
        run: swift test

      - name: Dump crash reports
        if: failure()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ || true
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do echo "=== $f"; head -c 20000 "$f"; done || true

  server-tests:
    name: Server Tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  shell-lint:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./
          severity: warning